name: Build Puzzle Hunter AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PuzzleHunterAI.zip'
      - '.github/workflows/build-puzzle-hunter.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          unzip -o PuzzleHunterAI.zip -d .
          test -f PuzzleHunterAI/app/build.gradle.kts

      - name: Build APK
        run: gradle -p PuzzleHunterAI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle-Hunter-AI-APK
          path: PuzzleHunterAI/app/build/outputs/apk/debug/app-debug.apk
